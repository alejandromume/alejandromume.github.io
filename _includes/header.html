<header class="site-header">

    <nav>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/todo/' | relative_url }}"{% if page.url == '/todo/' %} aria-current="page"{% endif %}>Todo</a>
      <a href="{{ '/temas/' | relative_url }}"{% if page.url == '/temas/' %} aria-current="page"{% endif %}>Temas</a>
      <a href="{{ '/nosotros/' | relative_url }}"{% if page.url == '/nosotros/' %} aria-current="page"{% endif %}>Nosotros</a>
    </nav>
  </div>
</header>
